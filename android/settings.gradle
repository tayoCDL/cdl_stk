pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.2.1" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

include ":app"
include ":flutter_document_picker"
include ":flutter_image_compress"
include ":flutter_jailbreak_detection"
include ":flutter_native_image"
include ":flutter_share"
include ":local_auth"
include ":open_file_safe"
include ":quick_actions"
include ":webview_flutter"
project(":flutter_document_picker").projectDir = new File("plugins/flutter_document_picker")
project(":flutter_image_compress").projectDir = new File("plugins/flutter_image_compress")
project(":flutter_jailbreak_detection").projectDir = new File("plugins/flutter_jailbreak_detection")
project(":flutter_native_image").projectDir = new File("plugins/flutter_native_image")
project(":flutter_share").projectDir = new File("plugins/flutter_share")
project(":local_auth").projectDir = new File("plugins/local_auth")
project(":open_file_safe").projectDir = new File("plugins/open_file_safe")
project(":quick_actions").projectDir = new File("plugins/quick_actions")
project(":webview_flutter").projectDir = new File("plugins/webview_flutter")
